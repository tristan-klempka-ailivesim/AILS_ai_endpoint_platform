services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"

  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    restart: unless-stopped
    profiles:
      - gpu
    ipc: host
    ports:
      - "${LLAMA_CPP_PORT:-8000}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=${LLAMA_CPP_CUDA_VISIBLE_DEVICES:-1}
      - NVIDIA_VISIBLE_DEVICES=${LLAMA_CPP_CUDA_VISIBLE_DEVICES:-1}
    command:
      - "--model-url"
      - "${LLAMA_CPP_MODEL_URL:-https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf}"
      - "--mmproj-url"
      - "${LLAMA_CPP_MMPROJ_URL:-https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/mmproj-BF16.gguf}"
      - "--alias"
      - "${LLAMA_CPP_MODEL_ALIAS:-gemma-4-26b-a4b-it-gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--ctx-size"
      - "${LLAMA_CPP_CTX_SIZE:-3200}"
      - "--n-gpu-layers"
      - "${LLAMA_CPP_N_GPU_LAYERS:-999}"
      - "--image-max-tokens"
      - "${LLAMA_CPP_IMAGE_MAX_TOKENS:-560}"
      - "--reasoning"
      - "${LLAMA_CPP_REASONING:-off}"
    volumes:
      - llama-cpp-cache:/root/.cache/llama.cpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  llama-cpp-cache:
